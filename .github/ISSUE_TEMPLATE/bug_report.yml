name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start "Keep Awake For 1 Hour"
        2. Close the lid on battery
        3. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Ajar → Settings → Helper → Copy Diagnostics, then paste here.
      render: text
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Air M2, 2022
