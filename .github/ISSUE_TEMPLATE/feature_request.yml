name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation. What would you like Ajar to do differently?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
